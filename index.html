<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer-when-downgrade">
  <title>부산 주요 상권 지도 조회 시스템</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  
  <!-- Leaflet MarkerCluster -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  
  <!-- PapaParse for Client-Side CSV Parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    * {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }
    #map {
      height: 100%;
      width: 100%;
      z-index: 10;
    }
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #f8fafc;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    
    /* Marker Cluster Visual Customization */
    .marker-cluster-small {
      background-color: rgba(59, 130, 246, 0.28) !important;
    }
    .marker-cluster-small div {
      background-color: rgba(37, 99, 235, 0.95) !important;
      color: #fff !important;
      font-weight: 700;
      font-size: 12px;
    }
    .marker-cluster-medium {
      background-color: rgba(16, 185, 129, 0.28) !important;
    }
    .marker-cluster-medium div {
      background-color: rgba(5, 150, 105, 0.95) !important;
      color: #fff !important;
      font-weight: 700;
      font-size: 12px;
    }
    .marker-cluster-large {
      background-color: rgba(244, 63, 94, 0.28) !important;
    }
    .marker-cluster-large div {
      background-color: rgba(225, 29, 72, 0.95) !important;
      color: #fff !important;
      font-weight: 700;
      font-size: 12px;
    }

    /* Pin Marker Styles */
    .pin-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .custom-marker {
      width: 32px;
      height: 32px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
      border: 2px solid #ffffff;
      transition: transform 0.15s ease-in-out;
    }
    .custom-marker:hover {
      transform: rotate(-45deg) scale(1.15);
      z-index: 999;
    }
    .marker-icon-inner {
      transform: rotate(45deg);
      font-size: 15px;
      color: #ffffff;
      line-height: 1;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col h-screen overflow-hidden select-none">

  <!-- Toast Notification -->
  <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-[2000] bg-slate-900/95 text-white text-xs sm:text-sm px-4 py-2.5 rounded-xl shadow-2xl flex items-center gap-2 transition-all duration-300 opacity-0 pointer-events-none transform -translate-y-2 backdrop-blur-sm border border-slate-700">
    <i id="toastIcon" class="ph ph-check-circle text-emerald-400 text-lg"></i>
    <span id="toastMsg">알림 메시지</span>
  </div>

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between shadow-sm z-30 flex-shrink-0">
    <div class="flex items-center space-x-3">
      <div class="bg-gradient-to-tr from-blue-600 to-indigo-600 text-white p-2.5 rounded-xl shadow-md flex items-center justify-center">
        <i class="ph-fill ph-map-pin-line text-xl font-bold"></i>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-base sm:text-lg font-bold tracking-tight text-slate-900">
            부산 주요 상권 지도 조회 시스템
          </h1>
          <span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">
            🇰🇷 한국어 지도
          </span>
        </div>
        <p class="text-xs text-slate-500 hidden sm:block">편의점 · 대형마트 · 백화점 · 헬스장 분류별 위치 및 실시간 길찾기</p>
      </div>
    </div>

    <!-- Actions & CSV Upload -->
    <div class="flex items-center space-x-2">
      <label for="csvFileInput" class="cursor-pointer inline-flex items-center gap-1.5 px-3 py-1.5 sm:px-3.5 sm:py-2 text-xs sm:text-sm font-semibold text-white bg-blue-600 hover:bg-blue-700 active:bg-blue-800 rounded-lg shadow-sm transition-all">
        <i class="ph ph-file-arrow-up text-base"></i>
        <span>CSV 파일 추가</span>
      </label>
      <input type="file" id="csvFileInput" accept=".csv" multiple class="hidden" />

      <button id="btnResetData" class="inline-flex items-center gap-1 px-2.5 py-1.5 text-xs text-slate-600 hover:text-slate-900 hover:bg-slate-100 rounded-lg border border-slate-200 transition" title="기본 데이터로 리셋">
        <i class="ph ph-arrow-counter-clockwise text-sm"></i>
        <span class="hidden md:inline">기본 샘플</span>
      </button>
      
      <button id="toggleSidebarBtn" class="lg:hidden p-2 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-100">
        <i class="ph ph-list text-lg"></i>
      </button>
    </div>
  </header>

  <main class="flex-1 flex flex-row overflow-hidden relative">
    
    <!-- Sidebar -->
    <aside id="sidebar" class="w-full sm:w-[400px] lg:w-[420px] bg-white border-r border-slate-200 flex flex-col z-20 absolute lg:relative inset-y-0 left-0 transform -translate-x-full lg:translate-x-0 transition-transform duration-200 ease-in-out shadow-xl lg:shadow-none">
      
      <!-- Filter Control Panel -->
      <div class="p-3.5 border-b border-slate-200 bg-slate-50/70 space-y-3">
        
        <!-- Search Input -->
        <div class="relative">
          <i class="ph ph-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-base"></i>
          <input type="text" id="searchInput" placeholder="상호명, 지점명, 도로명 주소 검색..." 
                 class="w-full pl-9 pr-8 py-2 bg-white text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition shadow-sm" />
          <button id="clearSearchBtn" class="hidden absolute right-2.5 top-2.5 text-slate-400 hover:text-slate-600">
            <i class="ph ph-x-circle text-base"></i>
          </button>
        </div>

        <!-- Major Category Tabs (큰 분류 탭) -->
        <div>
          <label class="block text-[11px] font-bold text-slate-500 mb-1.5 uppercase tracking-wider">큰 분류 선택</label>
          <div class="grid grid-cols-5 gap-1" id="mainCategoryTabs">
            <button data-cat="ALL" class="cat-tab py-1.5 rounded-lg text-xs font-bold text-center border transition bg-slate-900 text-white border-slate-900 shadow-sm">
              전체
            </button>
            <button data-cat="편의점" class="cat-tab py-1.5 rounded-lg text-xs font-bold text-center border transition bg-white text-blue-700 border-slate-200 hover:bg-blue-50">
              🏪 편의점
            </button>
            <button data-cat="대형마트" class="cat-tab py-1.5 rounded-lg text-xs font-bold text-center border transition bg-white text-amber-700 border-slate-200 hover:bg-amber-50">
              🛒 마트
            </button>
            <button data-cat="백화점" class="cat-tab py-1.5 rounded-lg text-xs font-bold text-center border transition bg-white text-rose-700 border-slate-200 hover:bg-rose-50">
              🏬 백화점
            </button>
            <button data-cat="헬스장" class="cat-tab py-1.5 rounded-lg text-xs font-bold text-center border transition bg-white text-emerald-700 border-slate-200 hover:bg-emerald-50">
              🏋️ 헬스장
            </button>
          </div>
        </div>

        <!-- Minor Category and District Selectors (작은 분류 & 구/군) -->
        <div class="grid grid-cols-2 gap-2">
          <!-- Sub Category Dropdown -->
          <div>
            <label class="block text-[11px] font-bold text-slate-500 mb-1">
              작은 분류 <span id="subcatCountLabel" class="text-blue-600 font-normal"></span>
            </label>
            <select id="subCategoryFilter" class="w-full py-1.5 px-2 text-xs bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 font-semibold text-slate-800">
              <option value="ALL">전체 작은분류</option>
            </select>
          </div>

          <!-- District Filter -->
          <div>
            <label class="block text-[11px] font-bold text-slate-500 mb-1">부산 시·군·구</label>
            <select id="districtFilter" class="w-full py-1.5 px-2 text-xs bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium text-slate-800">
              <option value="ALL">전체 구/군</option>
            </select>
          </div>
        </div>

        <!-- Quick Sub-Category Badges Container -->
        <div id="quickSubChipsWrap" class="pt-0.5">
          <div class="flex items-center justify-between text-[11px] text-slate-500 mb-1">
            <span class="font-medium">자주 찾는 작은 분류 태그</span>
          </div>
          <div id="quickSubChips" class="flex flex-wrap gap-1 max-h-16 overflow-y-auto pr-1">
            <!-- Dynamic Sub Chips -->
          </div>
        </div>

        <!-- Status Summary Bar -->
        <div class="flex items-center justify-between text-xs text-slate-600 pt-1 border-t border-slate-200/80">
          <div class="flex items-center gap-1.5 font-medium">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span>조회:</span>
            <strong id="filteredCount" class="text-blue-600 font-bold">0</strong>
            <span class="text-slate-400">/ <span id="totalCount">0</span>개</span>
          </div>
          <button id="fitBoundsBtn" class="text-[11px] text-blue-600 hover:text-blue-800 font-semibold underline flex items-center gap-0.5">
            <i class="ph ph-arrows-out-simple"></i> 화면 전체 맞춤
          </button>
        </div>
      </div>

      <!-- Store List View -->
      <div id="storeListContainer" class="flex-1 overflow-y-auto divide-y divide-slate-100 p-2 space-y-1">
        <!-- Stores rendered dynamically -->
      </div>

      <!-- Sidebar Footer -->
      <div id="fileStatusFooter" class="p-2.5 bg-slate-50 border-t border-slate-200 text-center text-[11px] text-slate-500 flex items-center justify-between px-3">
        <span class="truncate" id="activeFileName"><i class="ph ph-database mr-1"></i>부산 4대 업종 통합 데이터</span>
        <button id="btnScrollTop" class="text-slate-400 hover:text-slate-600 p-1" title="맨 위로">
          <i class="ph ph-arrow-up"></i>
        </button>
      </div>
    </aside>

    <!-- Map Container -->
    <div class="flex-1 relative h-full">
      <div id="map"></div>

      <!-- Korean Tile Layer Selector Widget (우측 상단 지도 레이어 전환) -->
      <div class="absolute top-4 right-4 z-[400] flex flex-col gap-1.5 bg-white/95 backdrop-blur-md p-2 rounded-xl shadow-lg border border-slate-200/90 text-xs">
        <div class="font-bold text-slate-800 px-1 flex items-center gap-1.5 pb-1 border-b border-slate-100">
          <i class="ph-bold ph-globe-hemisphere-east text-blue-600"></i> 한국어 지도 선택
        </div>
        <div class="flex flex-col gap-1" id="tileSelector">
          <button data-tile="koreanStandard" class="tile-btn px-2.5 py-1.5 rounded-lg font-bold text-left bg-blue-50 text-blue-700 border border-blue-200 flex items-center justify-between">
            <span>🇰🇷 고화질 한국어 지도</span>
            <i class="ph-bold ph-check text-blue-600"></i>
          </button>
          <button data-tile="koreanTerrain" class="tile-btn px-2.5 py-1.5 rounded-lg font-medium text-left text-slate-700 hover:bg-slate-50 flex items-center justify-between">
            <span>⛰️ 한국어 지형/등고선</span>
          </button>
          <button data-tile="cartoVoyager" class="tile-btn px-2.5 py-1.5 rounded-lg font-medium text-left text-slate-700 hover:bg-slate-50 flex items-center justify-between">
            <span>🌐 글로벌 백터 (CARTO)</span>
          </button>
          <button data-tile="cartoDark" class="tile-btn px-2.5 py-1.5 rounded-lg font-medium text-left text-slate-700 hover:bg-slate-50 flex items-center justify-between">
            <span>🌙 야간 다크 모드</span>
          </button>
        </div>
      </div>

      <!-- Drag-and-Drop Overlay -->
      <div id="dropZoneOverlay" class="hidden absolute inset-0 bg-blue-900/80 backdrop-blur-sm z-[500] flex flex-col items-center justify-center text-white border-4 border-dashed border-white m-4 rounded-3xl transition-all">
        <i class="ph ph-cloud-arrow-up text-6xl animate-bounce mb-3"></i>
        <h3 class="text-2xl font-bold">CSV 파일을 이곳에 놓아주세요</h3>
        <p class="text-sm text-blue-100 mt-1">편의점, 대형마트, 백화점, 헬스장 CSV 파일이 자동으로 분류 및 반영됩니다.</p>
      </div>

      <!-- Store Detail Card (우측 하단 상세 정보 카드) -->
      <div id="detailCard" class="hidden absolute bottom-5 left-4 right-4 sm:left-auto sm:right-6 sm:w-[410px] bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl border border-slate-200/90 z-[450] p-4 transition-all">
        <div class="flex items-start justify-between">
          <div class="flex items-center gap-1.5 flex-wrap">
            <span id="detailMainBadge" class="px-2 py-0.5 rounded text-[11px] font-bold bg-blue-100 text-blue-800">큰분류</span>
            <span id="detailSubBadge" class="px-2 py-0.5 rounded text-[11px] font-bold bg-slate-100 text-slate-700">작은분류</span>
            <h3 id="detailName" class="font-bold text-slate-900 text-base leading-tight w-full mt-1">상점명</h3>
          </div>
          <button id="closeDetailCard" class="text-slate-400 hover:text-slate-600 p-1">
            <i class="ph ph-x text-lg"></i>
          </button>
        </div>

        <div class="mt-3 space-y-1.5 text-xs text-slate-600">
          <div class="flex items-start gap-2">
            <i class="ph ph-map-pin text-rose-500 text-sm mt-0.5 flex-shrink-0"></i>
            <span id="detailAddress" class="break-all font-medium text-slate-800">도로명 주소</span>
          </div>
          <div class="flex items-center gap-2 text-slate-500 text-[11px]">
            <i class="ph ph-compass text-slate-400 text-sm flex-shrink-0"></i>
            <span>위경도: <span id="detailCoords">35.1234, 129.1234</span></span>
          </div>
          <div id="detailExtraWrap" class="flex items-center gap-2 text-slate-500 text-[11px]">
            <i class="ph ph-buildings text-slate-400 text-sm flex-shrink-0"></i>
            <span id="detailDistrict">부산광역시</span>
          </div>
        </div>

        <!-- Navigation Buttons: Kakao & Naver Directions (100% Fixed 도착지) -->
        <div class="mt-4 pt-3 border-t border-slate-100 flex flex-col gap-2">
          <div class="grid grid-cols-2 gap-2">
            <!-- Kakao Map Directions -->
            <button id="btnNaviKakao" class="w-full py-2 px-3 bg-[#FEE500] hover:bg-[#FADA0A] active:scale-[0.98] text-[#191919] text-xs font-bold rounded-xl flex items-center justify-center gap-1.5 shadow-sm transition">
              <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 3C6.477 3 2 6.477 2 10.765c0 2.766 1.874 5.188 4.7 6.556l-1.196 4.38a.5.5 0 00.758.541l5.225-3.468c.168.01.339.016.513.016 5.523 0 10-3.477 10-7.765C22 6.477 17.523 3 12 3z"/>
              </svg>
              <span class="truncate">카카오맵 길찾기</span>
            </button>

            <!-- Naver Map Directions with EPSG:3857 coordinates -->
            <button id="btnNaviNaver" class="w-full py-2 px-3 bg-[#03C75A] hover:bg-[#02b350] active:scale-[0.98] text-white text-xs font-bold rounded-xl flex items-center justify-center gap-1.5 shadow-sm transition">
              <svg class="w-3.5 h-3.5 flex-shrink-0" viewBox="0 0 24 24" fill="currentColor">
                <path d="M16.273 12.845L7.376 0H0v24h7.727V11.155L16.624 24H24V0h-7.727v12.845z"/>
              </svg>
              <span class="truncate">네이버지도 길찾기</span>
            </button>
          </div>

          <div class="flex items-center gap-2">
            <button id="btnCopyAddress" class="flex-1 py-1.5 px-3 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium rounded-lg flex items-center justify-center gap-1 transition">
              <i class="ph ph-copy"></i>
              <span>주소 복사</span>
            </button>
            <button id="btnZoomTo" class="py-1.5 px-3 bg-blue-50 hover:bg-blue-100 text-blue-700 text-xs font-semibold rounded-lg flex items-center justify-center gap-1 transition">
              <i class="ph ph-crosshair"></i>
              <span>중심 이동</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    // -------------------------------------------------------------------------
    // 1. 카테고리 구성 (큰 분류 & 작은 분류 사전)
    // -------------------------------------------------------------------------
    const CATEGORY_CONFIG = {
      "편의점": {
        color: "#2563eb",
        bg: "bg-blue-600",
        badge: "bg-blue-100 text-blue-800",
        icon: "🏪",
        defaults: ["CU", "GS25", "세븐일레븐", "이마트24", "미니스톱", "기타 편의점"]
      },
      "대형마트": {
        color: "#f59e0b",
        bg: "bg-amber-600",
        badge: "bg-amber-100 text-amber-800",
        icon: "🛒",
        defaults: ["홈플러스", "이마트", "롯데마트", "메가마트", "트레이더스", "하나로마트", "기타 대형마트"]
      },
      "백화점": {
        color: "#e11d48",
        bg: "bg-rose-600",
        badge: "bg-rose-100 text-rose-800",
        icon: "🏬",
        defaults: ["롯데백화점", "신세계백화점", "현대백화점", "NC백화점", "기타 백화점"]
      },
      "헬스장": {
        color: "#059669",
        bg: "bg-emerald-600",
        badge: "bg-emerald-100 text-emerald-800",
        icon: "🏋️",
        defaults: ["체력단련시설", "1:1 PT전문", "24시 휘트니스", "필라테스/요가", "크로스핏", "기타 운동시설"]
      }
    };

    // -------------------------------------------------------------------------
    // 2. 초기 풍부한 부산 주요 상권 데이터셋 (4개 카테고리 고르게 탑재)
    // -------------------------------------------------------------------------
    const INITIAL_BUSAN_STORES = [
      // === 대형마트 ===
      { id: "M1", mainCat: "대형마트", subCat: "이마트", name: "이마트 해운대점", district: "해운대구", address: "부산 해운대구 좌동순환로 511", lat: 35.1685, lng: 129.1672 },
      { id: "M2", mainCat: "대형마트", subCat: "홈플러스", name: "홈플러스 아시아드점", district: "연제구", address: "부산 연제구 종합운동장로 7", lat: 35.1912, lng: 129.0628 },

    // -------------------------------------------------------------------------
    function wgs84ToWebMercator(lng, lat) {
      const x = lng * 20037508.342789244 / 180;
      let y = Math.log(Math.tan((90 + lat) * Math.PI / 360)) / (Math.PI / 180);
      y = y * 20037508.342789244 / 180;
      return { x: x.toFixed(7), y: y.toFixed(7) };
    }

    // 6. CSV 자동 분류 및 인코딩 판별 파서

    function detectCategoryAndSubcategory(row, fileName = '') {
      const name = (row['상호명'] || row['name'] || '').trim();
      const branch = (row['지점명'] || '').trim();
      const fullName = branch ? `${name} ${branch}` : name;
      const bldg = (row['건물명'] || '').trim();
      const sCat = (row['상권업종소분류명'] || row['소분류'] || '').trim();
      const mCat = (row['상권업종중분류명'] || row['중분류'] || '').trim();
      const deptBrand = (row['백화점브랜드'] || '').trim();
      const martBrand = (row['마트브랜드'] || '').trim();

      let main = '편의점';
      let sub = '기타';

      // 1) 큰 분류 판별 (파일명 또는 컬럼 내용 기반)
      if (fileName.includes('마트') || martBrand || /마트|홈플러스|이마트|트레이더스|하나로/i.test(bldg)) {
        main = '대형마트';
        if (/이마트|트레이더스/i.test(fullName) || /이마트/i.test(bldg)) sub = /트레이더스/i.test(fullName) ? '트레이더스' : '이마트';
        else if (/홈플러스/i.test(fullName) || /홈플러스/i.test(bldg)) sub = '홈플러스';
        else if (/롯데마트/i.test(fullName) || /롯데마트/i.test(bldg)) sub = '롯데마트';
        else if (/메가마트/i.test(fullName) || /메가마트/i.test(bldg)) sub = '메가마트';
        else if (/하나로마트|농협/i.test(fullName)) sub = '하나로마트';
        else sub = sCat || '기타 대형마트';
      } 
      else if (fileName.includes('백화점') || deptBrand || /백화점|신세계|NC백화점/i.test(bldg)) {
        main = '백화점';
        if (/롯데/i.test(fullName) || /롯데/i.test(bldg)) sub = '롯데백화점';
        else if (/신세계/i.test(fullName) || /신세계/i.test(bldg)) sub = '신세계백화점';
        else if (/현대/i.test(fullName) || /현대/i.test(bldg)) sub = '현대백화점';
        else if (/NC|엔씨/i.test(fullName) || /NC/i.test(bldg)) sub = 'NC백화점';
        else sub = sCat || '기타 백화점';
      }
      else if (fileName.includes('헬스장') || /헬스|피트니스|휘트니스|PT|필라테스|크로스핏/i.test(fullName) || sCat === '헬스장') {
        main = '헬스장';
        if (/PT|피티/i.test(fullName)) sub = '1:1 PT전문';
        else if (/24시|24/i.test(fullName)) sub = '24시 휘트니스';
        else if (/필라테스|요가/i.test(fullName)) sub = '필라테스/요가';
        else if (/크로스핏/i.test(fullName)) sub = '크로스핏';
        else sub = sCat || '체력단련시설';
      }
      else {
        main = '편의점';
        if (/CU|씨유/i.test(fullName)) sub = 'CU';
        else if (/GS25|지에스/i.test(fullName)) sub = 'GS25';
        else if (/세븐일레븐|7-ELEVEN/i.test(fullName)) sub = '세븐일레븐';
        else if (/이마트24|EMART24/i.test(fullName)) sub = '이마트24';
        else if (/미니스톱|MINISTOP/i.test(fullName)) sub = '미니스톱';
        else sub = sCat || '기타 편의점';
      }

      return { main, sub };
    }

    function parseStoresFromCSV(csvString, fileName) {
      return new Promise((resolve) => {
        Papa.parse(csvString, {
          header: true,
          skipEmptyLines: true,
          dynamicTyping: true,
          complete: function(results) {
            const parsed = [];
            const data = results.data;

            for (let i = 0; i < data.length; i++) {
              const row = data[i];
              const lat = parseFloat(row['위도'] || row['lat'] || row['latitude'] || row['Y']);
              const lng = parseFloat(row['경도'] || row['lng'] || row['lon'] || row['longitude'] || row['X']);
              const rawName = (row['상호명'] || row['name'] || '').toString().trim();

              if (!rawName || isNaN(lat) || isNaN(lng)) continue;
              // 위경도 범위 유효성 체크 (부산 및 대한민국 인근)
              if (lat < 33 || lat > 39 || lng < 124 || lng > 132) continue;

              const branch = (row['지점명'] || '').toString().trim();
              const displayName = branch ? `${rawName} (${branch})` : rawName;
              const address = (row['도로명주소'] || row['지번주소'] || row['주소'] || '').toString().trim() || '주소 정보 미기재';
              const district = (row['시군구명'] || row['구'] || '').toString().trim() || extractDistrict(address);

              const { main, sub } = detectCategoryAndSubcategory(row, fileName);

              parsed.push({
                id: `store_${Date.now()}_${i}_${Math.random().toString(36).substr(2, 4)}`,
                mainCat: main,
                subCat: sub,
                name: displayName,
                rawName: rawName,
                address: address,
                district: district || '기타',
                lat: lat,
                lng: lng
              });
            }
            resolve(parsed);
          }
        });
      });
    }

    function extractDistrict(address) {
      if (!address) return '기타';
      const m = address.match(/([가-힣]+[구|군])/);
      return m ? m[1] : '기타';
    }

    // 파일 로더 (UTF-8 실패 시 EUC-KR 자동 시도)
    async function loadCsvFile(file) {
      showToast(`'${file.name}' 파일을 읽는 중...`, 'info');
      try {
        let text = await file.text();
        let parsed = await parseStoresFromCSV(text, file.name);

        // 한글 깨짐 여부() 감지 시 EUC-KR 재디코딩
        if (text.includes('') || (parsed.length > 0 && parsed[0].name.includes(''))) {
          const reader = new FileReader();
          reader.readAsText(file, 'EUC-KR');
          await new Promise((res) => {
            reader.onload = async () => {
              text = reader.result;
              parsed = await parseStoresFromCSV(text, file.name);
              res();
            };
          });
        }

        if (parsed.length > 0) {
          allStores = allStores.concat(parsed);
          document.getElementById('activeFileName').innerHTML = `<i class="ph ph-file-text mr-1"></i>${file.name} 외 통합 (${allStores.length}건)`;
          updateDistrictFilterOptions();
          updateSubCategoryOptions();
          renderApp();
          showToast(`${parsed.length}개의 매장이 성공적으로 추가되었습니다!`, 'success');
        } else {
          showToast(`유효한 위경도/상호명을 찾을 수 없습니다.`, 'error');
        }
      } catch (err) {
        console.error(err);
        showToast(`파일 처리 중 오류가 발생했습니다.`, 'error');
      }
    }

    // -------------------------------------------------------------------------
    // 8. 필터 옵션 동적 갱신
    // -------------------------------------------------------------------------
    function updateDistrictFilterOptions() {
      const districtSelect = document.getElementById('districtFilter');
      const districts = Array.from(new Set(allStores.map(s => s.district).filter(Boolean))).sort();

      const prev = filterState.district;
      districtSelect.innerHTML = '<option value="ALL">전체 구/군</option>';
      districts.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d;
        opt.textContent = d;
        districtSelect.appendChild(opt);
      });
      districtSelect.value = districts.includes(prev) ? prev : 'ALL';
    }

    // 큰 분류에 따른 작은 분류 옵션 및 칩 동적 갱신
    function updateSubCategoryOptions() {
      const subSelect = document.getElementById('subCategoryFilter');
      const chipsWrap = document.getElementById('quickSubChips');
      const countLabel = document.getElementById('subcatCountLabel');

      // 현재 큰 분류에 해당하는 스토어들
      let pool = allStores;
      if (filterState.mainCat !== 'ALL') {
        pool = allStores.filter(s => s.mainCat === filterState.mainCat);
      }

      // 작은 분류별 카운트 산출
      const counts = {};
      pool.forEach(s => {
        counts[s.subCat] = (counts[s.subCat] || 0) + 1;
      });

      const sortedSubCats = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);

      // 드롭다운 갱신
      const prevSub = filterState.subCat;
      subSelect.innerHTML = '<option value="ALL">전체 작은분류</option>';
      sortedSubCats.forEach(sub => {
        const opt = document.createElement('option');
        opt.value = sub;
        opt.textContent = `${sub} (${counts[sub]})`;
        subSelect.appendChild(opt);
      });
      subSelect.value = sortedSubCats.includes(prevSub) ? prevSub : 'ALL';
      filterState.subCat = subSelect.value;

      countLabel.textContent = `(${sortedSubCats.length}개 유형)`;

      // 하단 퀵 칩 태그 갱신
      chipsWrap.innerHTML = '';
      
      // '전체' 칩
      const allChip = document.createElement('button');
      allChip.className = `px-2 py-0.5 rounded-full text-[11px] font-semibold transition border ${
        filterState.subCat === 'ALL'
          ? 'bg-slate-800 text-white border-slate-800 shadow-sm'
          : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-100'
      }`;
      allChip.textContent = `전체 (${pool.length})`;
      allChip.onclick = () => {
        filterState.subCat = 'ALL';
        subSelect.value = 'ALL';
        updateSubCategoryOptions();
        renderApp();
      };
      chipsWrap.appendChild(allChip);

      // 상위 10개 작은 분류 칩 표시
      sortedSubCats.slice(0, 12).forEach(sub => {
        const chip = document.createElement('button');
        const isActive = filterState.subCat === sub;
        chip.className = `px-2 py-0.5 rounded-full text-[11px] font-semibold transition border ${
          isActive
            ? 'bg-blue-600 text-white border-blue-600 shadow-sm'
            : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-100'
        }`;
        chip.textContent = `${sub} ${counts[sub]}`;
        chip.onclick = () => {
          filterState.subCat = isActive ? 'ALL' : sub;
          subSelect.value = filterState.subCat;
          updateSubCategoryOptions();
          renderApp();
        };
        chipsWrap.appendChild(chip);
      });
    }

    // -------------------------------------------------------------------------
    // 9. 핵심 렌더링 함수 (필터링 -> 마커 클러스터 -> 사이드바 리스트)
    // -------------------------------------------------------------------------
    function renderApp(fitToBounds = false) {
      // 1. 필터링
      filteredStores = allStores.filter(item => {
        if (filterState.mainCat !== 'ALL' && item.mainCat !== filterState.mainCat) return false;
        if (filterState.subCat !== 'ALL' && item.subCat !== filterState.subCat) return false;
        if (filterState.district !== 'ALL' && item.district !== filterState.district) return false;
        if (filterState.keyword) {
          const kw = filterState.keyword.toLowerCase();
          const matchName = item.name.toLowerCase().includes(kw);
          const matchAddr = item.address.toLowerCase().includes(kw);
          const matchSub = item.subCat.toLowerCase().includes(kw);
          if (!matchName && !matchAddr && !matchSub) return false;
        }
        return true;
      });

      // 2. 카운트 업데이트
      document.getElementById('filteredCount').textContent = filteredStores.length;
      document.getElementById('totalCount').textContent = allStores.length;

      // 3. 마커 렌더링
      markerCluster.clearLayers();
      storeMarkerMap.clear();

      const newMarkers = [];
      filteredStores.forEach(store => {
        const marker = L.marker([store.lat, store.lng], {
          icon: createCustomMarkerIcon(store.mainCat)
        });

        // 팝업 내용 (네이버 길찾기 목적지 핀 & 카카오 길찾기 내장)
        const merc = wgs84ToWebMercator(store.lng, store.lat);
        const encodedName = encodeURIComponent(store.name);
        const naverUrl = `https://map.naver.com/p/directions/-/${merc.x},${merc.y},${encodedName},,ADDRESS_POI/-/car`;
        const kakaoUrl = `https://map.kakao.com/link/to/${encodedName},${store.lat},${store.lng}`;
        const catCfg = CATEGORY_CONFIG[store.mainCat] || CATEGORY_CONFIG['편의점'];

        const popupHtml = `
          <div style="min-width: 220px; font-family: inherit; padding: 2px;">
            <div style="display:flex; align-items:center; gap:4px; margin-bottom: 5px;">
              <span style="font-size:10px; font-weight:800; padding:2px 6px; border-radius:4px; ${catCfg.badge};">
                ${catCfg.icon} ${store.mainCat}
              </span>
              <span style="font-size:10px; font-weight:600; padding:2px 6px; border-radius:4px; background:#f1f5f9; color:#475569;">
                ${store.subCat}
              </span>
            </div>
            <h4 style="font-size: 14px; font-weight: 700; color: #0f172a; margin: 0 0 4px 0;">${store.name}</h4>
            <p style="font-size: 12px; color: #64748b; margin: 0 0 8px 0; line-height: 1.3;">${store.address}</p>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 4px;">
              <a href="${kakaoUrl}" target="_blank" style="display:flex; align-items:center; justify-content:center; gap:3px; padding: 6px 0; background: #FEE500; color: #191919; font-weight: 700; font-size: 11px; text-decoration: none; border-radius: 6px;">
                카카오길찾기
              </a>
              <a href="${naverUrl}" target="_blank" style="display:flex; align-items:center; justify-content:center; gap:3px; padding: 6px 0; background: #03C75A; color: #ffffff; font-weight: 700; font-size: 11px; text-decoration: none; border-radius: 6px;">
                네이버길찾기
              </a>
            </div>
          </div>
        `;

        marker.bindPopup(popupHtml);
        marker.on('click', () => {
          selectStore(store, false);
        });

        storeMarkerMap.set(store.id, marker);
        newMarkers.push(marker);
      });

      markerCluster.addLayers(newMarkers);

      // 4. 지도 뷰 맞춤
      if (fitToBounds && filteredStores.length > 0) {
        const bounds = L.latLngBounds(filteredStores.map(s => [s.lat, s.lng]));
        map.fitBounds(bounds, { padding: [50, 50], maxZoom: 15 });
      }

      // 5. 사이드바 리스트 렌더링
      renderSidebarList();
    }

    // -------------------------------------------------------------------------
    // 10. 사이드바 매장 목록 렌더링
    // -------------------------------------------------------------------------
    function renderSidebarList() {
      const container = document.getElementById('storeListContainer');
      container.innerHTML = '';

      if (filteredStores.length === 0) {
        container.innerHTML = `
          <div class="py-12 text-center text-slate-400 space-y-2">
            <i class="ph ph-magnifying-glass text-4xl stroke-1"></i>
            <p class="text-sm font-semibold">조건에 맞는 매장이 없습니다.</p>
            <p class="text-xs text-slate-400">필터나 검색어를 변경해 보세요.</p>
          </div>
        `;
        return;
      }

      // 렌더링 부하 방지를 위해 상위 150개 목록화
      const slice = filteredStores.slice(0, 150);

      slice.forEach(store => {
        const isSelected = store.id === selectedStoreId;
        const catCfg = CATEGORY_CONFIG[store.mainCat] || CATEGORY_CONFIG['편의점'];

        const item = document.createElement('div');
        item.className = `p-3 rounded-xl cursor-pointer transition border ${
          isSelected 
            ? 'bg-blue-50/90 border-blue-300 shadow-sm' 
            : 'bg-white hover:bg-slate-50 border-slate-200/80 hover:border-slate-300'
        }`;

        item.innerHTML = `
          <div class="flex items-start justify-between gap-1.5">
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-1.5 mb-1">
                <span class="px-1.5 py-0.5 rounded text-[10px] font-bold ${catCfg.badge}">
                  ${catCfg.icon} ${store.mainCat}
                </span>
                <span class="px-1.5 py-0.5 rounded text-[10px] font-medium bg-slate-100 text-slate-600 truncate">
                  ${store.subCat}
                </span>
                <span class="text-[11px] text-slate-400 ml-auto flex-shrink-0">${store.district}</span>
              </div>
              <h4 class="text-xs font-bold text-slate-900 truncate">${store.name}</h4>
              <p class="text-[11px] text-slate-500 truncate mt-0.5 flex items-center gap-1">
                <i class="ph ph-map-pin text-slate-400"></i> ${store.address}
              </p>
            </div>
            <i class="ph ph-caret-right text-slate-300 mt-2 text-sm flex-shrink-0"></i>
          </div>
        `;

        item.onclick = () => {
          selectStore(store, true);
        };

        container.appendChild(item);
      });

      if (filteredStores.length > 150) {
        const note = document.createElement('div');
        note.className = 'py-2 text-center text-[11px] text-slate-400 font-medium';
        note.textContent = `외 ${filteredStores.length - 150}개의 매장이 더 있습니다. 검색어로 범위를 좁혀보세요.`;
        container.appendChild(note);
      }
    }

    // -------------------------------------------------------------------------
    // 11. 매장 선택 및 상세 카드 & 길찾기 연동
    // -------------------------------------------------------------------------
    function selectStore(store, panMap = true) {
      selectedStoreId = store.id;

      // 사이드바 하이라이트 갱신
      renderSidebarList();

      if (panMap) {
        map.flyTo([store.lat, store.lng], 16, {
          duration: 1
        });
        const marker = storeMarkerMap.get(store.id);
        if (marker) {
          setTimeout(() => marker.openPopup(), 400);
        }
      }

      // 우측 하단 상세 카드 노출
      const card = document.getElementById('detailCard');
      const catCfg = CATEGORY_CONFIG[store.mainCat] || CATEGORY_CONFIG['편의점'];

      document.getElementById('detailMainBadge').textContent = `${catCfg.icon} ${store.mainCat}`;
      document.getElementById('detailMainBadge').className = `px-2 py-0.5 rounded text-[11px] font-bold ${catCfg.badge}`;
      document.getElementById('detailSubBadge').textContent = store.subCat;
      document.getElementById('detailName').textContent = store.name;
      document.getElementById('detailAddress').textContent = store.address;
      document.getElementById('detailCoords').textContent = `${store.lat.toFixed(5)}, ${store.lng.toFixed(5)}`;
      document.getElementById('detailDistrict').textContent = `${store.district} 상권`;

      // 카카오맵 길찾기
      const encodedName = encodeURIComponent(store.name);
      document.getElementById('btnNaviKakao').onclick = () => {
        window.open(`https://map.kakao.com/link/to/${encodedName},${store.lat},${store.lng}`, '_blank');
      };

      // 네이버지도 길찾기 (EPSG:3857 Web Mercator 변환 적용으로 도착지 핀 및 상호명 100% 채움)
      const merc = wgs84ToWebMercator(store.lng, store.lat);
      document.getElementById('btnNaviNaver').onclick = () => {
        const naverUrl = `https://map.naver.com/p/directions/-/${merc.x},${merc.y},${encodedName},,ADDRESS_POI/-/car`;
        window.open(naverUrl, '_blank');
      };

      // 주소 복사
      document.getElementById('btnCopyAddress').onclick = () => {
        copyToClipboard(store.address);
        showToast('주소가 클립보드에 복사되었습니다.', 'success');
      };

      // 중심 이동
      document.getElementById('btnZoomTo').onclick = () => {
        map.setView([store.lat, store.lng], 17);
      };

      card.classList.remove('hidden');
    }

    function closeDetailCard() {
      document.getElementById('detailCard').classList.add('hidden');
      selectedStoreId = null;
      renderSidebarList();
    }

    function copyToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text);
      } else {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
    }

    function showToast(message, type = 'info') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      const toastIcon = document.getElementById('toastIcon');

      toastMsg.textContent = message;
      if (type === 'success') {
        toastIcon.className = 'ph ph-check-circle text-emerald-400 text-lg';
      } else if (type === 'error') {
        toastIcon.className = 'ph ph-warning-circle text-rose-400 text-lg';
      } else {
        toastIcon.className = 'ph ph-info text-blue-400 text-lg';
      }

      toast.classList.remove('opacity-0', '-translate-y-2', 'pointer-events-none');
      setTimeout(() => {
        toast.classList.add('opacity-0', '-translate-y-2', 'pointer-events-none');
      }, 2600);
    }

    // -------------------------------------------------------------------------
    // 12. 이벤트 리스너 바인딩
    // -------------------------------------------------------------------------
    document.addEventListener('DOMContentLoaded', () => {
      // 1. 큰 분류 탭 클릭 이벤트
      document.querySelectorAll('#mainCategoryTabs .cat-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('#mainCategoryTabs .cat-tab').forEach(b => {
            b.className = 'cat-tab py-1.5 rounded-lg text-xs font-bold text-center border transition bg-white text-slate-700 border-slate-200 hover:bg-slate-50';
          });
          tab.className = 'cat-tab py-1.5 rounded-lg text-xs font-bold text-center border transition bg-slate-900 text-white border-slate-900 shadow-sm';

          filterState.mainCat = tab.dataset.cat;
          filterState.subCat = 'ALL';
          updateSubCategoryOptions();
          renderApp(true);
        });
      });

      // 2. 작은 분류 셀렉트 변경
      document.getElementById('subCategoryFilter').addEventListener('change', (e) => {
        filterState.subCat = e.target.value;
        updateSubCategoryOptions();
        renderApp(true);
      });

      // 3. 구/군 셀렉트 변경
      document.getElementById('districtFilter').addEventListener('change', (e) => {
        filterState.district = e.target.value;
        renderApp(true);
      });

      // 4. 검색어 입력
      const searchInput = document.getElementById('searchInput');
      const clearSearchBtn = document.getElementById('clearSearchBtn');
      searchInput.addEventListener('input', (e) => {
        filterState.keyword = e.target.value.trim();
        clearSearchBtn.classList.toggle('hidden', filterState.keyword.length === 0);
        renderApp(false);
      });
      clearSearchBtn.addEventListener('click', () => {
        searchInput.value = '';
        filterState.keyword = '';
        clearSearchBtn.classList.add('hidden');
        renderApp(false);
      });

      // 5. 전체 맞춤 버튼
      document.getElementById('fitBoundsBtn').addEventListener('click', () => {
        if (filteredStores.length > 0) {
          const bounds = L.latLngBounds(filteredStores.map(s => [s.lat, s.lng]));
          map.fitBounds(bounds, { padding: [40, 40] });
        } else {
          map.setView(BUSAN_CENTER, 12);
        }
      });

      // 6. 상세 카드 닫기
      document.getElementById('closeDetailCard').addEventListener('click', closeDetailCard);

      // 7. 모바일 사이드바 토글
      const sidebar = document.getElementById('sidebar');
      document.getElementById('toggleSidebarBtn').addEventListener('click', () => {
        sidebar.classList.toggle('-translate-x-full');
      });

      // 8. 맨 위로 스크롤
      document.getElementById('btnScrollTop').addEventListener('click', () => {
        document.getElementById('storeListContainer').scrollTo({ top: 0, behavior: 'smooth' });
      });

      // 9. 기본 데이터로 리셋
      document.getElementById('btnResetData').addEventListener('click', () => {
        allStores = [...INITIAL_BUSAN_STORES];
        document.getElementById('activeFileName').innerHTML = `<i class="ph ph-database mr-1"></i>기본 부산 4대 업종 데이터`;
        filterState = { mainCat: 'ALL', subCat: 'ALL', district: 'ALL', keyword: '' };
        searchInput.value = '';
        clearSearchBtn.classList.add('hidden');
        document.getElementById('districtFilter').value = 'ALL';
        
        // 탭 UI 리셋
        document.querySelectorAll('#mainCategoryTabs .cat-tab').forEach((b, idx) => {
          if (idx === 0) b.className = 'cat-tab py-1.5 rounded-lg text-xs font-bold text-center border transition bg-slate-900 text-white border-slate-900 shadow-sm';
          else b.className = 'cat-tab py-1.5 rounded-lg text-xs font-bold text-center border transition bg-white text-slate-700 border-slate-200 hover:bg-slate-50';
        });

        updateDistrictFilterOptions();
        updateSubCategoryOptions();
        renderApp(true);
        showToast('기본 데이터로 초기화되었습니다.', 'info');
      });

      // 10. 지도 레이어 전환 버튼들
      document.querySelectorAll('#tileSelector .tile-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const tileKey = btn.dataset.tile;
          if (TILE_LAYERS[tileKey]) {
            map.removeLayer(currentTile);
            currentTile = TILE_LAYERS[tileKey].addTo(map);

            // 스타일 활성화 상태 반영
            document.querySelectorAll('#tileSelector .tile-btn').forEach(b => {
              b.className = 'tile-btn px-2.5 py-1.5 rounded-lg font-medium text-left text-slate-700 hover:bg-slate-50 flex items-center justify-between';
              const icon = b.querySelector('.ph-check');
              if (icon) icon.remove();
            });
            btn.className = 'tile-btn px-2.5 py-1.5 rounded-lg font-bold text-left bg-blue-50 text-blue-700 border border-blue-200 flex items-center justify-between';
            btn.innerHTML += `<i class="ph-bold ph-check text-blue-600"></i>`;
          }
        });
      });

      // 11. CSV 파일 업로드 input
      document.getElementById('csvFileInput').addEventListener('change', async (e) => {
        const files = Array.from(e.target.files);
        for (const file of files) {
          await loadCsvFile(file);
        }
        e.target.value = '';
      });

      // 12. 전체 화면 드래그 앤 드롭 업로드 지원
      const dropZone = document.getElementById('dropZoneOverlay');
      window.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.remove('hidden');
      });
      window.addEventListener('dragleave', (e) => {
        if (e.clientX <= 0 || e.clientY <= 0 || e.clientX >= window.innerWidth || e.clientY >= window.innerHeight) {
          dropZone.classList.add('hidden');
        }
      });
      window.addEventListener('drop', async (e) => {
        e.preventDefault();
        dropZone.classList.add('hidden');
        const files = Array.from(e.dataTransfer.files).filter(f => f.name.toLowerCase().endsWith('.csv'));
        if (files.length === 0) {
          showToast('CSV 파일만 드래그하여 등록할 수 있습니다.', 'error');
          return;
        }
        for (const file of files) {
          await loadCsvFile(file);
        }
      });

      // 초기 실행
      updateDistrictFilterOptions();
      updateSubCategoryOptions();
      renderApp(true);
    });
  </script>
</body>
</html>
